name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Domain unit tests
        run: ./gradlew :core:domain:test --console=plain
      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain
        continue-on-error: true
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: studin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
